# My first learning workflow
name: First CI

on:
  push:
    branches:
      - main

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Inspect workspace
        run: |
          pwd
          ls -la

      - name: Validate shell script
        run: bash -n check.sh
        
      - name: Run project check
        run: bash check.sh

      - name: Run tests
        run: bash tests/test_app.sh
        
      - name: Say hello
        run: echo "CI works"
      
